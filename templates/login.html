
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px #cccccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #2196F3;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            color: #2196F3;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>TrustVault Login</h2>

        <form method="POST">

            <!-- CSRF Token -->
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <br><br>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?</p>

        <a href="{{ url_for('register') }}">Create Account</a>

    </div>

</body>
</html>
